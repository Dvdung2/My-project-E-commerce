services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:?SA_PASSWORD is required (see .env.example)}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./Backend/E_CommerceAPI
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EcommerceDb;User Id=sa;Password=${SA_PASSWORD:?SA_PASSWORD is required (see .env.example)};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:?JWT_KEY is required (see .env.example)}
      - SeedAdmin__Email=${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required (see .env.example)}
      - SeedAdmin__Password=${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required (see .env.example)}
      - SeedAdmin__FullName=${SEED_ADMIN_NAME:-Shop Admin}
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
